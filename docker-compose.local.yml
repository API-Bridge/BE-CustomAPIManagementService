# Custom API Service Docker Compose
# MySQL과 애플리케이션만 실행하고, 외부 ELK/Kafka 컨테이너에 연결
version: '3.8'

services:
  # MySQL 서비스
  mysql:
    image: mysql:8.0
    container_name: custom-api-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Custom API Service
  custom-api-svc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: custom-api-svc
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      # 컨테이너 내부에서 MySQL 연결을 위한 호스트 설정
      - DB_URL=mysql:3306
      # Redis는 외부 컨테이너 사용 (systemmanagementsvc_app-network 네트워크를 통해 접근)
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      # Kafka는 외부 컨테이너 사용 (systemmanagementsvc_app-network 네트워크를 통해 접근)
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - LOG_PATH=/app/logs
      - LOG_FILE=${LOG_FILE}
      - HOSTNAME=${HOSTNAME}
      - CONTAINER_ID=${CONTAINER_ID}
      - SPRING_APPLICATION_NAME=${SPRING_APPLICATION_NAME}
    volumes:
      - app_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,version,environment"
    labels:
      - "service=${SPRING_APPLICATION_NAME}"
      - "version=${BUILD_VERSION}"
      - "environment=${ENVIRONMENT}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SERVER_PORT}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - app-network
      - systemmanagementsvc_app-network
      - external-services
      - usersvc_app-network

volumes:
  mysql_data:
  app_logs:

networks:
  # 내부 애플리케이션 네트워크
  app-network:
    driver: bridge
  
  # 외부 ELK/Kafka 네트워크와 연결
  systemmanagementsvc_app-network:
    external: true
  
  # 외부 Redis 네트워크와 연결
  external-services:
    external: true
  
  # 외부 User 서비스 네트워크와 연결
  usersvc_app-network:
    external: true

# 사용법:
# 1. .env 파일을 환경에 맞게 설정
# 2. 외부 ELK/Kafka 스택이 systemmanagementsvc_app-network에서 실행 중이어야 함
# 3. 실행: docker-compose --env-file .env -f docker-compose.local.yml up -d
#
# 외부 서비스 컨테이너들:
# - Kafka: 6839477c2a57 (systemmanagementsvc_app-network)
# - Elasticsearch: ea0c1f4915c9 (systemmanagementsvc_app-network)  
# - Logstash: eccb042477f8 (systemmanagementsvc_app-network)
# - Filebeat: 05b6cdb58cd4 (systemmanagementsvc_app-network)
# - User Service: 77ad126387bd (usersvc_app-network, external-services) - 컨테이너명: user-service