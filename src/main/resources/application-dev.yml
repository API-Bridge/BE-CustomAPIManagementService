spring:
  jpa:
    hibernate:
      ddl-auto: create-drop  # 애플리케이션 시작시 스키마 생성 (데이터 보존)
    defer-datasource-initialization: true  # Hibernate 스키마 생성 후 data.sql 실행
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true  # 데이터베이스 자동 생성 활성화
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl  # 테이블명 그대로 사용
  sql:
    init:
      mode: always  # 더미 데이터 파일 실행 활성화 (개발 환경용)
      data-locations: classpath:data.sql
      continue-on-error: false  # SQL 오류 시 중단

# 외부 마이크로서비스 설정 (개발 환경)
external-api-service:
  base-url: ${EXTERNAL_API_SERVICE_URL:http://localhost:8082}
  timeout: 5000
  retry-attempts: 3

user-service:
  base-url: ${USER_SERVICE_URL:http://localhost:8081}
  timeout: 3000
  retry-attempts: 2
  mock:
    enabled: false  # 개발 환경에서 Mock User 서비스 사용

# Gemini AI 설정 (개발 환경)
gemini:
  api:
    key: ${GEMINI_API_KEY:}
    timeout: 30000
    model: gemini-1.5-flash-latest

# 로깅 레벨 추가
logging:
  level:
    org.springframework.jdbc: DEBUG
    org.springframework.boot.autoconfigure.sql.init: DEBUG
    org.example.customapisvc.service.impl: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
