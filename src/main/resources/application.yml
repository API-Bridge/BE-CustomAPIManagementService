spring:
  application:
    name: custom-api-svc
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  # Jackson 설정
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false


  # JPA 설정 (Amazon Corretto 17 최적화)
  jpa:
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true
    show-sql: false
    open-in-view: false
  
  # SQL 초기화 설정
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      continue-on-error: false
      separator: ;
      encoding: utf-8

  # Kafka 설정
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${SERVICE_NAME:custom-api-svc}-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        max.poll.records: 500
        enable.auto.commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        acks: all
        retries: 3


  # 데이터베이스 설정
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/custom_api_service_db?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&autoCommit=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:cell4086}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000


# Gemini AI 설정
gemini:
  api:
    key: ${GEMINI_API_KEY:}

# 외부 마이크로서비스 설정
external-api-service:
  base-url: ${EXTERNAL_API_SERVICE_URL:http://localhost:8082}

user-service:
  base-url: ${USER_SERVICE_URL:http://localhost:8081}

# AWS 설정
#aws:
#  secretsmanager:
#    region: ${AWS_REGION:ap-northeast-2}

# Circuit Breaker 설정 (Resilience4j)
resilience4j:
  circuitbreaker:
    instances:
      default:
        slidingWindowSize: 100
        permittedNumberOfCallsInHalfOpenState: 10
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 20
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 3s
  retry:
    instances:
      default:
        maxAttempts: 3
        waitDuration: 1s
        exponentialBackoffMultiplier: 2
  bulkhead:
    instances:
      default:
        maxConcurrentCalls: 10

# 로깅 설정
logging:
  level:
    root: INFO
    org.example.customapisvc: DEBUG
    org.springframework.kafka: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"

# ELK Stack 설정
elk:
  logstash:
    enabled: ${ELK_LOGSTASH_ENABLED:false}
    host: ${LOGSTASH_HOST:localhost}
    port: ${LOGSTASH_PORT:5044}
  filebeat:
    enabled: ${ELK_FILEBEAT_ENABLED:true}
    log-path: ${LOG_PATH:/app/logs}
  elasticsearch:
    host: ${ELASTICSEARCH_HOST:localhost}
    port: ${ELASTICSEARCH_PORT:9200}
    index-pattern: custom-api-svc-logs
    username: ${ELASTIC_USERNAME:elastic}
    password: ${ELASTIC_PASSWORD:changeme}

# 모니터링 설정 (Actuator + Prometheus)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      service: custom-api-svc
      version: ${BUILD_VERSION:dev}
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: true

# 서버 설정
server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /api
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    max-connections: 8192

# OpenAPI 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

---
# 개발 환경 설정
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    consumer:
      group-id: custom-api-svc-dev-group
---
# 프로덕션 환경 설정
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    org.example.customapisvc: INFO
    org.springframework.security: WARN
  file:
    name: logs/custom-api-svc.log

management:
  endpoint:
    health:
      show-details: never
