input {
  tcp {
    port => 5000
    codec => json_lines
  }
  
  beats {
    port => 5044
  }
  
  file {
    path => "/logs/*.json"
    start_position => "beginning"
    codec => json
    tags => ["json-file"]
  }
}

filter {
  # Parse timestamp
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
    }
  }
  
  # Add service metadata
  mutate {
    add_field => { "[@metadata][index]" => "custom-api-svc-logs-%{+YYYY.MM.dd}" }
  }
  
  # Parse log level
  if [level] {
    mutate {
      rename => { "level" => "log_level" }
    }
  }
  
  # Extract trace information
  if [mdc][traceId] {
    mutate {
      add_field => { "trace_id" => "%{[mdc][traceId]}" }
    }
  }
  
  if [mdc][spanId] {
    mutate {
      add_field => { "span_id" => "%{[mdc][spanId]}" }
    }
  }
  
  # Clean up fields
  mutate {
    remove_field => [ "host", "agent", "ecs", "input" ]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index]}"
    template_name => "custom-api-svc"
    template => "/usr/share/logstash/templates/custom-api-svc-template.json"
    template_overwrite => true
  }
  
  stdout {
    codec => rubydebug
  }
}