input {
  beats {
    port => 5044
  }
}

filter {
  # JSON 파싱
  if [message] {
    json {
      source => "message"
      target => "app"
    }
  }
  
  # 컨테이너 정보 처리
  if [container][name] {
    mutate {
      add_field => { "service_name" => "%{[container][name]}" }
    }
    
    # Spring Boot 로그 레벨 정규화
    if [app][level] {
      mutate {
        uppercase => [ "[app][level]" ]
      }
    }
    
    # 에러 로그 태깅
    if [app][level] == "ERROR" {
      mutate {
        add_tag => [ "error" ]
      }
    }
    
    # 스택 트레이스 태깅
    if [app][stack_trace] and [app][stack_trace] != "" {
      mutate {
        add_tag => [ "exception" ]
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOST:elasticsearch}:${ELASTICSEARCH_PORT:9200}"]
    user => "${ELASTIC_USERNAME}"
    password => "${ELASTIC_PASSWORD}"
    index => "custom-api-svc-logs-%{+YYYY.MM.dd}"
    manage_template => true
    template_name => "custom-api-svc-logs"
    template_pattern => "custom-api-svc-logs-*"
    template => {
      "index_patterns" => ["custom-api-svc-logs-*"]
      "settings" => {
        "number_of_shards" => 1
        "number_of_replicas" => 0
        "index.refresh_interval" => "5s"
      }
      "mappings" => {
        "properties" => {
          "@timestamp" => { "type" => "date" }
          "service_name" => { "type" => "keyword" }
          "app" => {
            "properties" => {
              "service" => { "type" => "keyword" }
              "level" => { "type" => "keyword" }
              "logger" => { "type" => "keyword" }
              "thread" => { "type" => "keyword" }
              "message" => { 
                "type" => "text",
                "analyzer" => "standard"
              }
              "stack_trace" => { 
                "type" => "text",
                "analyzer" => "keyword"
              }
              "pid" => { "type" => "keyword" }
              "version" => { "type" => "keyword" }
              "environment" => { "type" => "keyword" }
              "host" => { "type" => "keyword" }
              "container_id" => { "type" => "keyword" }
            }
          }
          "container" => {
            "properties" => {
              "name" => { "type" => "keyword" }
              "image" => {
                "properties" => {
                  "name" => { "type" => "keyword" }
                }
              }
            }
          }
        }
      }
    }
  }
}