filebeat.inputs:
- type: container
  paths:
    - '/var/lib/docker/containers/*/*.log'
  
  # JSON 파싱 설정
  json.keys_under_root: true
  json.add_error_key: true
  json.message_key: log

# 전역 프로세서 설정
processors:
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"
  
  # custom-api-svc 컨테이너만 필터링
  - drop_event:
      when:
        not:
          contains:
            container.name: "custom-api-svc"

# Logstash 출력 설정
output.logstash:
  hosts: ["logstash:5044"]

# 로그 레벨 설정
logging.level: info
logging.to_files: true
logging.files:
  path: /usr/share/filebeat/logs
  name: filebeat
  keepfiles: 7
  permissions: 0644